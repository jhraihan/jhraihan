<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Md. Jahid Hasan Raihan, full-stack developer in Dhaka, Bangladesh. Django, DRF, React and PostgreSQL.">
<defs>
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#06222b"/><stop offset="42%" stop-color="#03151b"/><stop offset="100%" stop-color="#010a0e"/>
  </linearGradient>
  <linearGradient id="nameG" x1="0%" x2="100%">
    <stop offset="0%" stop-color="#ffffff"/><stop offset="46%" stop-color="#d8fff8"/><stop offset="100%" stop-color="#2ee8cf"/>
  </linearGradient>
  <linearGradient id="hair" x1="0%" x2="100%">
    <stop offset="0%" stop-color="#2ee8cf" stop-opacity=".9"/>
    <stop offset="100%" stop-color="#2ee8cf" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="sweep" x1="0%" x2="100%">
    <stop offset="0%" stop-color="#7dffe9" stop-opacity="0"/>
    <stop offset="50%" stop-color="#7dffe9" stop-opacity=".55"/>
    <stop offset="100%" stop-color="#7dffe9" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="glowL" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#0d6d7d" stop-opacity=".55"/><stop offset="100%" stop-color="#0d6d7d" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="26"/></filter>
</defs>

<rect width="1000" height="320" rx="20" fill="url(#bg)"/>

<!-- ambient light, breathing -->
<ellipse cx="250" cy="150" rx="330" ry="180" fill="url(#glowL)" filter="url(#soft)">
  <animate attributeName="opacity" values=".75;1;.75" dur="9s" repeatCount="indefinite"/>
</ellipse>


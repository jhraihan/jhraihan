<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Md. Jahid Hasan Raihan, full-stack developer. React, DRF, Django and PostgreSQL orbiting a central system core.">
<defs>
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#062630"/><stop offset="45%" stop-color="#03161d"/><stop offset="100%" stop-color="#010a0e"/>
  </linearGradient>
  <linearGradient id="nameG" x1="0%" x2="100%">
    <stop offset="0%" stop-color="#ffffff"/><stop offset="48%" stop-color="#d8fff8"/><stop offset="100%" stop-color="#2ee8cf"/>
  </linearGradient>
  <linearGradient id="hair" x1="0%" x2="100%">
    <stop offset="0%" stop-color="#2ee8cf" stop-opacity=".85"/><stop offset="100%" stop-color="#2ee8cf" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="coreG">
    <stop offset="0%" stop-color="#ffffff"/><stop offset="30%" stop-color="#a8fff2"/>
    <stop offset="70%" stop-color="#2ec9c6"/><stop offset="100%" stop-color="#0d6b76"/>
  </radialGradient>
  <radialGradient id="aura">
    <stop offset="0%" stop-color="#0c6f7e" stop-opacity=".26"/><stop offset="100%" stop-color="#0e7d8c" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="38"/></filter>
  <filter id="coreGlow" x="-200%" y="-200%" width="500%" height="500%">
    <feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect width="1000" height="340" rx="20" fill="url(#bg)"/>
<ellipse cx="740" cy="170" rx="250" ry="175" fill="url(#aura)" filter="url(#soft)">
  <animate attributeName="opacity" values=".72;1;.72" dur="9s" repeatCount="indefinite"/>
</ellipse>

<g fill="#9ff5ea">
  <circle cx="556" cy="54" r="1"><animate attributeName="opacity" values=".12;.5;.12" dur="5s" repeatCount="indefinite"/></circle>
  <circle cx="952" cy="80" r="1.2"><animate attributeName="opacity" values=".1;.45;.1" dur="6.5s" repeatCount="indefinite"/></circle>
  <circle cx="600" cy="302" r="1"><animate attributeName="opacity" values=".1;.4;.1" dur="7.5s" repeatCount="indefinite"/></circle>
  <circle cx="918" cy="294" r="1.1"><animate attributeName="opacity" values=".12;.46;.12" dur="5.8s" repeatCount="indefinite"/></circle>
  <circle cx="506" cy="200" r="1"><animate attributeName="opacity" values=".08;.38;.08" dur="8s" repeatCount="indefinite"/></circle>
</g>

<g opacity="0">
  <animate attributeName="opacity" values="0;1" dur="0.9s" begin="0.7s" fill="freeze"/>
  <circle cx="740" cy="170" r="26" fill="none" stroke="#7dffe9" stroke-width="1.2">
    <animate attributeName="r" values="26;58;26" dur="4.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".4;0;.4" dur="4.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="740" cy="170" r="22" fill="url(#coreG)" filter="url(#coreGlow)">
    <animate attributeName="r" values="21;23.5;21" dur="4.4s" repeatCount="indefinite"/>
  </circle>
  <text x="740" y="174" text-anchor="middle" fill="#04232a" font-size="10.5" font-weight="700"
        letter-spacing="1" font-family="ui-monospace,Menlo,Consolas,monospace">SYS</text>
</g>

<ellipse cx="740" cy="170" rx="62" ry="31.0" fill="none" stroke="#8dfff2" stroke-width="1.15" opacity="0"><animate attributeName="opacity" values="0;.30" dur="1s" begin="1.00s" fill="freeze"/></ellipse><g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.8s" begin="1.35s" fill="freeze"/><g><animateMotion dur="18s" repeatCount="indefinite" path="M681.7 159.4 A62 31.0 0 1 1 798.3 180.6 A62 31.0 0 1 1 681.7 159.4" calcMode="linear"/><rect x="-47" y="-29.5" width="94" height="19" rx="5" fill="#02161c" opacity=".9"/><text x="0" y="-16.0" text-anchor="middle" fill="#e8fffb" font-size="11.5" font-weight="700" letter-spacing=".8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">React</text><circle r="11.5" fill="#02161c"/><circle r="9.0" fill="#8dfff2" opacity=".26"/><circle r="6.0" fill="#8dfff2"/><circle r="2.5" fill="#ffffff" opacity=".85"/></g></g><ellipse cx="740" cy="170" rx="112" ry="56.0" fill="none" stroke="#45dcd6" stroke-width="1.15" opacity="0"><animate attributeName="opacity" values="0;.30" dur="1s" begin="1.18s" fill="freeze"/></ellipse><g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.8s" begin="1.53s" fill="freeze"/><g><animateMotion dur="27s" repeatCount="indefinite" path="M825.8 206.0 A112 56.0 0 1 0 654.2 134.0 A112 56.0 0 1 0 825.8 206.0" calcMode="linear"/><rect x="-47" y="16.5" width="94" height="19" rx="5" fill="#02161c" opacity=".9"/><text x="0" y="30.0" text-anchor="middle" fill="#e8fffb" font-size="11.5" font-weight="700" letter-spacing=".8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">DRF</text><circle r="11.1" fill="#02161c"/><circle r="8.6" fill="#45dcd6" opacity=".26"/><circle r="5.6" fill="#45dcd6"/><circle r="2.4" fill="#ffffff" opacity=".85"/></g></g><ellipse cx="740" cy="170" rx="162" ry="81.0" fill="none" stroke="#26aec0" stroke-width="1.15" opacity="0"><animate attributeName="opacity" values="0;.30" dur="1s" begin="1.36s" fill="freeze"/></ellipse><g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.8s" begin="1.71s" fill="freeze"/><g><animateMotion dur="38s" repeatCount="indefinite" path="M599.7 210.5 A162 81.0 0 1 1 880.3 129.5 A162 81.0 0 1 1 599.7 210.5" calcMode="linear"/><rect x="-47" y="-29.5" width="94" height="19" rx="5" fill="#02161c" opacity=".9"/><text x="0" y="-16.0" text-anchor="middle" fill="#e8fffb" font-size="11.5" font-weight="700" letter-spacing=".8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Django</text><circle r="11.1" fill="#02161c"/><circle r="8.6" fill="#26aec0" opacity=".26"/><circle r="5.6" fill="#26aec0"/><circle r="2.4" fill="#ffffff" opacity=".85"/></g></g><ellipse cx="740" cy="170" rx="214" ry="107.0" fill="none" stroke="#1a8298" stroke-width="1.15" opacity="0"><animate attributeName="opacity" values="0;.30" dur="1s" begin="1.54s" fill="freeze"/></ellipse><g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.8s" begin="1.89s" fill="freeze"/><g><animateMotion dur="52s" repeatCount="indefinite" path="M903.9 101.2 A214 107.0 0 1 0 576.1 238.8 A214 107.0 0 1 0 903.9 101.2" calcMode="linear"/><rect x="-47" y="16.5" width="94" height="19" rx="5" fill="#02161c" opacity=".9"/><text x="0" y="30.0" text-anchor="middle" fill="#e8fffb" font-size="11.5" font-weight="700" letter-spacing=".8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">PostgreSQL</text><circle r="10.7" fill="#02161c"/><circle r="8.2" fill="#1a8298" opacity=".26"/><circle r="5.2" fill="#1a8298"/><circle r="2.2" fill="#ffffff" opacity=".85"/></g></g>



<text x="62" y="96" fill="#3fbfb4" font-size="11" letter-spacing="7.2" opacity="0"
      font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">FULL-STACK DEVELOPER
  <animate attributeName="opacity" values="0;1" dur="1s" begin="0.15s" fill="freeze"/></text>
<rect x="62" y="112" width="0" height="1.4" fill="url(#hair)">
  <animate attributeName="width" values="0;300" dur="1.1s" begin="0.3s" fill="freeze"
           calcMode="spline" keyTimes="0;1" keySplines=".16 1 .3 1"/></rect>

<g opacity="0">
  <animate attributeName="opacity" values="0;1" dur="1s" begin="0.5s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" values="0 20;0 0" dur="1.3s" begin="0.5s"
    fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".16 1 .3 1"/>
  <text x="58" y="168" fill="url(#nameG)" font-size="43" font-weight="300" letter-spacing="1.2"
        font-family="Segoe UI,Helvetica,Arial,sans-serif">Md. Jahid</text>
  <text x="58" y="212" fill="url(#nameG)" font-size="43" font-weight="700" letter-spacing="-.5"
        font-family="Segoe UI,Helvetica,Arial,sans-serif">Hasan Raihan</text>
</g>

<text x="62" y="252" fill="#5eead4" font-size="13.5" opacity="0" letter-spacing=".4"
      font-family="ui-monospace,Menlo,Consolas,monospace">Every layer in orbit around one system
  <animate attributeName="opacity" values="0;1" dur="1s" begin="1.15s" fill="freeze"/></text>
<text x="62" y="280" fill="#42808b" font-size="12" opacity="0"
      font-family="ui-monospace,Menlo,Consolas,monospace">Dhaka, Bangladesh  &#183;  interface, API and database
  <animate attributeName="opacity" values="0;1" dur="1s" begin="1.35s" fill="freeze"/></text>
</svg>

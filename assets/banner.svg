    <animate attributeName="opacity" values="0;0.95;0" keyTimes="0;0.12;0.4" dur="4.4s" begin="0.62s" repeatCount="indefinite"/>
  </rect>
  <text x="350" y="192" text-anchor="middle" fill="#e8fffc" font-size="15" font-weight="700"

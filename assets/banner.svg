<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Md. Jahid Hasan Raihan, Full-Stack Software Engineer">
  <defs>
    <linearGradient id="core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/><stop offset="50%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="name" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="55%" stop-color="#e0f2fe"/><stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="rule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="60%" stop-color="#4f46e5" stop-opacity=".5"/><stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vig" cx="22%" cy="45%" r="80%">
      <stop offset="0%" stop-color="#0c1c33"/><stop offset="60%" stop-color="#070d1a"/><stop offset="100%" stop-color="#04070f"/>
    </radialGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="haze" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="26"/></filter>
  </defs>

  <rect width="1000" height="280" rx="22" fill="url(#vig)"/>
  <g stroke="#22d3ee" stroke-opacity=".05" stroke-width="1">
    <path d="M0 70H1000M0 140H1000M0 210H1000"/>
    <path d="M125 0V280M250 0V280M375 0V280M500 0V280M625 0V280M750 0V280M875 0V280"/>
  </g>
  <ellipse cx="165" cy="140" rx="105" ry="95" fill="#1d4ed8" opacity=".28" filter="url(#haze)"/>

  <!-- hex core glyph -->
  <g transform="translate(165 140)">
    <g filter="url(#glow)">
      <g opacity=".95">
        <path d="M0 -84 L73 -42 L73 42 L0 84 L-73 42 L-73 -42 Z" fill="none" stroke="url(#core)" stroke-width="2.6" opacity=".6">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="34s" repeatCount="indefinite"/>
        </path>
        <path d="M0 -58 L50 -29 L50 29 L0 58 L-50 29 L-50 -29 Z" fill="none" stroke="url(#core)" stroke-width="2" opacity=".42">
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="26s" repeatCount="indefinite"/>
        </path>
      </g>
      <g stroke="#22d3ee" stroke-width="1.6" opacity=".55">
        <path d="M0 -84V-58M73 -42L50 -29M73 42L50 29M0 84V58M-73 42L-50 29M-73 -42L-50 -29"/>
      </g>
      <circle r="27" fill="none" stroke="#7dd3fc" stroke-width="2.4" opacity=".9"/>
      <circle r="10" fill="#a5f3fc">
        <animate attributeName="r" values="9;12;9" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;.72;1" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <g fill="#7dd3fc">
        <circle cx="0" cy="-84" r="3.6"/><circle cx="73" cy="-42" r="3.6"/><circle cx="73" cy="42" r="3.6"/>
        <circle cx="0" cy="84" r="3.6"/><circle cx="-73" cy="42" r="3.6"/><circle cx="-73" cy="-42" r="3.6"/>
      </g>
    </g>
  </g>

  <!-- wordmark -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <text x="322" y="86" fill="#22d3ee" font-size="13" letter-spacing="5.5" opacity=".92">FULL-STACK SOFTWARE ENGINEER</text>
    <text x="322" y="152" fill="url(#name)" font-size="46" font-weight="700" letter-spacing="-1.2"
          font-family="Segoe UI,Helvetica,Arial,sans-serif">Md. Jahid Hasan Raihan</text>
    <rect x="322" y="172" width="560" height="2" fill="url(#rule)"/>
    <text x="322" y="208" fill="#93c5fd" font-size="16">Django · DRF · React · PostgreSQL</text>
    <text x="322" y="238" fill="#64748b" font-size="13.5">Dhaka, Bangladesh  ·  I build complete systems, end to end</text>
  </g>
</svg>

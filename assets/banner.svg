  <text x="350" y="212" text-anchor="middle" fill="#5f93a0" font-size="10.5"
        font-family="ui-monospace,Menlo,Consolas,monospace">serializers · JWT</text>
</g>
<g>
  <rect x="484.0" y="164.0" width="132" height="64" rx="14" fill="#08222c" stroke="#1d6b78" stroke-width="1.4"/>
  <rect x="484.0" y="164.0" width="132" height="64" rx="14" fill="none" stroke="#3dffe0" stroke-width="1.8" opacity="0">
    <animate attributeName="opacity" values="0;0.95;0" keyTimes="0;0.12;0.4" dur="4.4s" begin="1.24s" repeatCount="indefinite"/>
  </rect>
  <text x="550" y="192" text-anchor="middle" fill="#e8fffc" font-size="15" font-weight="700"
        font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Django</text>
  <text x="550" y="212" text-anchor="middle" fill="#5f93a0" font-size="10.5"

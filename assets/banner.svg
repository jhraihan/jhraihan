<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="Md. Jahid Hasan Raihan, full-stack developer. An orbital diagram of his stack: React, DRF, JWT, Django, ORM, PostgreSQL and Redis circling a core.">
<defs>
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#062430"/><stop offset="45%" stop-color="#03161d"/><stop offset="100%" stop-color="#010a0e"/>
  </linearGradient>
  <linearGradient id="nameG" x1="0%" x2="100%">
    <stop offset="0%" stop-color="#ffffff"/><stop offset="48%" stop-color="#d8fff8"/><stop offset="100%" stop-color="#2ee8cf"/>
  </linearGradient>
  <linearGradient id="hair" x1="0%" x2="100%">
    <stop offset="0%" stop-color="#2ee8cf" stop-opacity=".85"/><stop offset="100%" stop-color="#2ee8cf" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="core">
    <stop offset="0%" stop-color="#ffffff"/><stop offset="35%" stop-color="#9afff0"/><stop offset="100%" stop-color="#18a8ad"/>
  </radialGradient>
  <radialGradient id="aura">
    <stop offset="0%" stop-color="#10808f" stop-opacity=".6"/><stop offset="100%" stop-color="#10808f" stop-opacity="0"/>
  </radialGradient>
  <filter id="gl" x="-200%" y="-200%" width="500%" height="500%">
    <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft"><feGaussianBlur stdDeviation="34"/></filter>
</defs>

<rect width="1000" height="330" rx="20" fill="url(#bg)"/>
<ellipse cx="770" cy="164" rx="250" ry="210" fill="url(#aura)" filter="url(#soft)">
  <animate attributeName="opacity" values=".7;1;.7" dur="8s" repeatCount="indefinite"/>
</ellipse>

<!-- ORBITAL SYSTEM -->
<g filter="url(#gl)"><ellipse cx="768" cy="164" rx="56" ry="35" fill="none" stroke="#7dffe9" stroke-width="1" stroke-dasharray="3 7" opacity="0"><animate attributeName="opacity" values="0;.32" dur="0.9s" begin="0.90s" fill="freeze"/></ellipse><g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.7s" begin="1.20s" fill="freeze"/><g><animateMotion dur="15s" repeatCount="indefinite" path="M820.6 175.9 A56 35 0 1 1 715.4 152.1 A56 35 0 1 1 820.6 175.9" calcMode="linear"/><circle r="5.2" fill="#7dffe9"/><circle r="10.5" fill="#7dffe9" opacity=".2"/><text x="0" y="-13" text-anchor="middle" fill="#d3fff9" font-size="10.5" letter-spacing=".5" font-family="ui-monospace,Menlo,Consolas,monospace">React</text></g></g><ellipse cx="768" cy="164" rx="94" ry="58" fill="none" stroke="#4de0d8" stroke-width="1" stroke-dasharray="3 7" opacity="0"><animate attributeName="opacity" values="0;.32" dur="0.9s" begin="1.06s" fill="freeze"/></ellipse><g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.7s" begin="1.36s" fill="freeze"/><g><animateMotion dur="23s" repeatCount="indefinite" path="M707.6 208.6 A94 58 0 1 0 828.4 119.4 A94 58 0 1 0 707.6 208.6" calcMode="linear"/><circle r="5.2" fill="#4de0d8"/><circle r="10.5" fill="#4de0d8" opacity=".2"/><text x="0" y="-13" text-anchor="middle" fill="#d3fff9" font-size="10.5" letter-spacing=".5" font-family="ui-monospace,Menlo,Consolas,monospace">DRF</text></g></g><g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.7s" begin="1.36s" fill="freeze"/><g><animateMotion dur="23s" repeatCount="indefinite" path="M759.8 105.9 A94 58 0 1 0 776.2 222.1 A94 58 0 1 0 759.8 105.9" calcMode="linear"/><circle r="5.2" fill="#4de0d8"/><circle r="10.5" fill="#4de0d8" opacity=".2"/><text x="0" y="-13" text-anchor="middle" fill="#d3fff9" font-size="10.5" letter-spacing=".5" font-family="ui-monospace,Menlo,Consolas,monospace">JWT</text></g></g><ellipse cx="768" cy="164" rx="132" ry="82" fill="none" stroke="#2bb8c4" stroke-width="1" stroke-dasharray="3 7" opacity="0"><animate attributeName="opacity" values="0;.32" dur="0.9s" begin="1.22s" fill="freeze"/></ellipse><g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.7s" begin="1.52s" fill="freeze"/><g><animateMotion dur="32s" repeatCount="indefinite" path="M843.7 231.0 A132 82 0 1 1 692.3 97.0 A132 82 0 1 1 843.7 231.0" calcMode="linear"/><circle r="5.2" fill="#2bb8c4"/><circle r="10.5" fill="#2bb8c4" opacity=".2"/><text x="0" y="-13" text-anchor="middle" fill="#d3fff9" font-size="10.5" letter-spacing=".5" font-family="ui-monospace,Menlo,Consolas,monospace">Django</text></g></g><g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.7s" begin="1.52s" fill="freeze"/><g><animateMotion dur="32s" repeatCount="indefinite" path="M653.7 123.1 A132 82 0 1 1 882.3 204.9 A132 82 0 1 1 653.7 123.1" calcMode="linear"/><circle r="5.2" fill="#2bb8c4"/><circle r="10.5" fill="#2bb8c4" opacity=".2"/><text x="0" y="-13" text-anchor="middle" fill="#d3fff9" font-size="10.5" letter-spacing=".5" font-family="ui-monospace,Menlo,Consolas,monospace">ORM</text></g></g><ellipse cx="768" cy="164" rx="170" ry="105" fill="none" stroke="#1d8a9c" stroke-width="1" stroke-dasharray="3 7" opacity="0"><animate attributeName="opacity" values="0;.32" dur="0.9s" begin="1.38s" fill="freeze"/></ellipse><g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.7s" begin="1.68s" fill="freeze"/><g><animateMotion dur="44s" repeatCount="indefinite" path="M738.5 267.8 A170 105 0 1 0 797.5 60.2 A170 105 0 1 0 738.5 267.8" calcMode="linear"/><circle r="5.2" fill="#1d8a9c"/><circle r="10.5" fill="#1d8a9c" opacity=".2"/><text x="0" y="-13" text-anchor="middle" fill="#d3fff9" font-size="10.5" letter-spacing=".5" font-family="ui-monospace,Menlo,Consolas,monospace">PostgreSQL</text></g></g><g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.7s" begin="1.68s" fill="freeze"/><g><animateMotion dur="44s" repeatCount="indefinite" path="M826.1 65.0 A170 105 0 1 0 709.9 263.0 A170 105 0 1 0 826.1 65.0" calcMode="linear"/><circle r="5.2" fill="#1d8a9c"/><circle r="10.5" fill="#1d8a9c" opacity=".2"/><text x="0" y="-13" text-anchor="middle" fill="#d3fff9" font-size="10.5" letter-spacing=".5" font-family="ui-monospace,Menlo,Consolas,monospace">Redis</text></g></g></g>

<!-- core -->
<g opacity="0">
  <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.75s" fill="freeze"/>
  <circle cx="768" cy="164" r="21" fill="url(#core)" filter="url(#gl)">
    <animate attributeName="r" values="20;23;20" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="768" cy="164" r="34" fill="none" stroke="#7dffe9" stroke-width="1" opacity=".35">
    <animate attributeName="r" values="26;54;26" dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".45;0;.45" dur="3.6s" repeatCount="indefinite"/>
  </circle>
</g>

<!-- IDENTITY -->
<text x="62" y="92" fill="#3fbfb4" font-size="11" letter-spacing="7.2" opacity="0"
      font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">FULL-STACK DEVELOPER
  <animate attributeName="opacity" values="0;1" dur="1s" begin="0.15s" fill="freeze"/></text>

<rect x="62" y="108" width="0" height="1.4" fill="url(#hair)">
  <animate attributeName="width" values="0;312" dur="1.1s" begin="0.3s" fill="freeze"
           calcMode="spline" keyTimes="0;1" keySplines=".16 1 .3 1"/></rect>

<g opacity="0">
  <animate attributeName="opacity" values="0;1" dur="1s" begin="0.5s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" values="0 20;0 0" dur="1.3s" begin="0.5s"
    fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".16 1 .3 1"/>
  <text x="58" y="162" fill="url(#nameG)" font-size="43" font-weight="300" letter-spacing="1.2"
        font-family="Segoe UI,Helvetica,Arial,sans-serif">Md. Jahid</text>
  <text x="58" y="206" fill="url(#nameG)" font-size="43" font-weight="700" letter-spacing="-.5"
        font-family="Segoe UI,Helvetica,Arial,sans-serif">Hasan Raihan</text>
</g>

<text x="62" y="244" fill="#5eead4" font-size="13.5" opacity="0" letter-spacing=".4"
      font-family="ui-monospace,Menlo,Consolas,monospace">Everything in orbit around one system
  <animate attributeName="opacity" values="0;1" dur="1s" begin="1.15s" fill="freeze"/></text>
<text x="62" y="274" fill="#42808b" font-size="12" opacity="0"
      font-family="ui-monospace,Menlo,Consolas,monospace">Dhaka, Bangladesh  ·  interface, API and database
  <animate attributeName="opacity" values="0;1" dur="1s" begin="1.35s" fill="freeze"/></text>
</svg>

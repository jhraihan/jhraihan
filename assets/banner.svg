<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="JR monogram with the name Md. Jahid Hasan Raihan, full-stack developer, Dhaka Bangladesh">
<defs>
  <linearGradient id="hx" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#a8fff4"/><stop offset="45%" stop-color="#2ee8cf"/><stop offset="100%" stop-color="#0b6f7d"/>
  </linearGradient>
  <linearGradient id="mono" x1="10%" y1="0%" x2="90%" y2="100%">
    <stop offset="0%" stop-color="#ffffff"/><stop offset="48%" stop-color="#b6fff5"/><stop offset="100%" stop-color="#2ee8cf"/>
  </linearGradient>
  <linearGradient id="nameG" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ffffff"/><stop offset="58%" stop-color="#d6fff9"/><stop offset="100%" stop-color="#2ee8cf"/>
  </linearGradient>
  <linearGradient id="ruleG" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#2ee8cf"/><stop offset="62%" stop-color="#2ee8cf" stop-opacity=".22"/><stop offset="100%" stop-color="#2ee8cf" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="bg" cx="18%" cy="42%" r="98%">
    <stop offset="0%" stop-color="#05262d"/><stop offset="54%" stop-color="#02151a"/><stop offset="100%" stop-color="#01090c"/>
  </radialGradient>
  <filter id="gl" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="haze" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="44"/></filter>
</defs>

<rect width="1000" height="300" rx="22" fill="url(#bg)"/>
<g stroke="#2ee8cf" stroke-opacity=".04" stroke-width="1">
  <path d="M0 75H1000M0 150H1000M0 225H1000"/>
  <path d="M125 0V300M250 0V300M375 0V300M500 0V300M625 0V300M750 0V300M875 0V300"/>
</g>
<ellipse cx="176" cy="150" rx="150" ry="140" fill="#17a49e" opacity=".22" filter="url(#haze)"/>

<!-- ===== JR MONOGRAM MARK ===== -->
<g transform="translate(176 142)" filter="url(#gl)">
  <!-- outer hex -->
  <path d="M0 -82 L71 -41 L71 41 L0 82 L-71 41 L-71 -41 Z" fill="#06242c" stroke="url(#hx)" stroke-width="3.2"/>
  <!-- inner counter-rotating ring -->
  <path d="M0 -60 L52 -30 L52 30 L0 60 L-52 30 L-52 -30 Z" fill="none" stroke="url(#hx)" stroke-width="1.5" opacity=".32">
    <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="34s" repeatCount="indefinite"/>
  </path>
  <!-- monogram -->
  <text x="0" y="19" text-anchor="middle" fill="url(#mono)" font-size="54" font-weight="700"
        font-family="Segoe UI,Helvetica,Arial,sans-serif" letter-spacing="-3">JR</text>
  <!-- vertex nodes -->
  <g fill="#a8fff4">
    <circle cx="0" cy="-82" r="4"><animate attributeName="opacity" values="1;.35;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="71" cy="-41" r="4"><animate attributeName="opacity" values="1;.35;1" dur="4s" begin="-.7s" repeatCount="indefinite"/></circle>
    <circle cx="71" cy="41" r="4"><animate attributeName="opacity" values="1;.35;1" dur="4s" begin="-1.4s" repeatCount="indefinite"/></circle>
    <circle cx="0" cy="82" r="4"><animate attributeName="opacity" values="1;.35;1" dur="4s" begin="-2.1s" repeatCount="indefinite"/></circle>
    <circle cx="-71" cy="41" r="4"><animate attributeName="opacity" values="1;.35;1" dur="4s" begin="-2.8s" repeatCount="indefinite"/></circle>
    <circle cx="-71" cy="-41" r="4"><animate attributeName="opacity" values="1;.35;1" dur="4s" begin="-3.5s" repeatCount="indefinite"/></circle>
  </g>
</g>

<!-- ===== WORDMARK ===== -->
<g>
  <text x="332" y="112" fill="#2ee8cf" font-size="12.5" letter-spacing="6"
        font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">FULL-STACK DEVELOPER</text>
  <text x="332" y="172" fill="url(#nameG)" font-size="45" font-weight="700" letter-spacing="-1.2"
        font-family="Segoe UI,Helvetica,Arial,sans-serif">Md. Jahid Hasan Raihan</text>
  <rect x="332" y="190" width="540" height="2" fill="url(#ruleG)"/>
  <text x="332" y="222" fill="#5eead4" font-size="15.5"
        font-family="ui-monospace,Menlo,Consolas,monospace">Django · DRF · React · PostgreSQL</text>
  <text x="332" y="250" fill="#4d8f8a" font-size="12.5"
        font-family="ui-monospace,Menlo,Consolas,monospace" letter-spacing=".6">Dhaka, Bangladesh  ·  Building complete systems, end to end</text>
</g>
</svg>

  <text x="150" y="212" text-anchor="middle" fill="#5f93a0" font-size="10.5"
        font-family="ui-monospace,Menlo,Consolas,monospace">Vite · Router</text>
</g>
<g>
  <rect x="284.0" y="164.0" width="132" height="64" rx="14" fill="#08222c" stroke="#1d6b78" stroke-width="1.4"/>

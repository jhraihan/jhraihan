  <text x="906" y="212" text-anchor="middle" fill="#5f93a0" font-size="10.5"
        font-family="ui-monospace,Menlo,Consolas,monospace">Postgres</text>
</g>
<circle r="4.5" fill="#3dffe0" filter="url(#pg)"><animateMotion dur="4.4s" begin="0s" repeatCount="indefinite" path="M216.0 196H284.0M416.0 196H484.0M616.0 196H684.0M816.0 196H858"/></circle>
<circle r="4.5" fill="#3dffe0" filter="url(#pg)"><animateMotion dur="4.4s" begin="1.47s" repeatCount="indefinite" path="M216.0 196H284.0M416.0 196H484.0M616.0 196H684.0M816.0 196H858"/></circle>
<circle r="4.5" fill="#3dffe0" filter="url(#pg)"><animateMotion dur="4.4s" begin="2.94s" repeatCount="indefinite" path="M216.0 196H284.0M416.0 196H484.0M616.0 196H684.0M816.0 196H858"/></circle>

<!-- footer line -->
<text x="58" y="292" fill="#7fb8c2" font-size="12.5"
      font-family="ui-monospace,Menlo,Consolas,monospace">Auth at the edge · permissions per role · prefetch to kill N+1 · schema before the first endpoint</text>
<text x="58" y="314" fill="#3f7883" font-size="11.5"
      font-family="ui-monospace,Menlo,Consolas,monospace">Every project is a whole system — interface, API and database — not an isolated feature.</text>
</svg>

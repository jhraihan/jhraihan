<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Md. Jahid Hasan Raihan, full-stack developer. A live diagram showing a request travelling from React through DRF and Django and the ORM to PostgreSQL.">
<defs>
  <radialGradient id="bg" cx="20%" cy="18%" r="105%">
    <stop offset="0%" stop-color="#062a33"/><stop offset="50%" stop-color="#02161c"/><stop offset="100%" stop-color="#01090c"/>
  </radialGradient>
  <linearGradient id="nameG" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ffffff"/><stop offset="52%" stop-color="#cdfff7"/><stop offset="100%" stop-color="#2ee8cf"/>
  </linearGradient>
  <linearGradient id="hx" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#a8fff4"/><stop offset="50%" stop-color="#2ee8cf"/><stop offset="100%" stop-color="#0b6f7d"/>
  </linearGradient>
  <filter id="pg" x="-300%" y="-300%" width="700%" height="700%">
    <feGaussianBlur stdDeviation="3.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="40"/></filter>
</defs>

<rect width="1000" height="340" rx="22" fill="url(#bg)"/>
<g stroke="#2ee8cf" stroke-opacity=".035" stroke-width="1">
  <path d="M0 68H1000M0 136H1000M0 204H1000M0 272H1000"/>
  <path d="M125 0V340M250 0V340M375 0V340M500 0V340M625 0V340M750 0V340M875 0V340"/>
</g>
<ellipse cx="200" cy="80" rx="260" ry="120" fill="#12808c" opacity=".2" filter="url(#soft)"/>

<!-- header row: mark + name -->
<g transform="translate(58 62)">
  <path d="M0 -34 L29 -17 L29 17 L0 34 L-29 17 L-29 -17 Z" fill="#06242c" stroke="url(#hx)" stroke-width="2.2"/>
  <text x="0" y="8" text-anchor="middle" fill="url(#hx)" font-size="22" font-weight="700"
        font-family="Segoe UI,Helvetica,Arial,sans-serif" letter-spacing="-1.2">JR</text>
</g>
<g>
  <text x="104" y="54" fill="url(#nameG)" font-size="30" font-weight="700" letter-spacing="-.7"
        font-family="Segoe UI,Helvetica,Arial,sans-serif">Md. Jahid Hasan Raihan</text>
  <text x="105" y="78" fill="#4d9aa2" font-size="12" letter-spacing="3.4"
        font-family="ui-monospace,Menlo,Consolas,monospace">FULL-STACK DEVELOPER · DHAKA, BD</text>
</g>

<!-- section label -->
<text x="58" y="128" fill="#2ee8cf" font-size="11.5" letter-spacing="4.4"
      font-family="ui-monospace,Menlo,Consolas,monospace">THE PATH OF A SINGLE REQUEST</text>

<!-- pipeline -->
<path d="M216.0 196H284.0" stroke="#1d6b78" stroke-width="1.6" fill="none"/>
<path d="M416.0 196H484.0" stroke="#1d6b78" stroke-width="1.6" fill="none"/>
<path d="M616.0 196H684.0" stroke="#1d6b78" stroke-width="1.6" fill="none"/>
<path d="M816.0 196H858" stroke="#1d6b78" stroke-width="1.6" fill="none"/>
<path d="M276.0 191l8 5-8 5z" fill="#2ee8cf" opacity=".75"/>
<path d="M476.0 191l8 5-8 5z" fill="#2ee8cf" opacity=".75"/>
<path d="M676.0 191l8 5-8 5z" fill="#2ee8cf" opacity=".75"/>
<path d="M850 191l8 5-8 5z" fill="#2ee8cf" opacity=".75"/>

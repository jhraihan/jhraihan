<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="A friendly robot waving hello beside the name Md. Jahid Hasan Raihan, full-stack developer">
<defs>
  <radialGradient id="bgB" cx="15%" cy="46%" r="96%">
    <stop offset="0%" stop-color="#05242a"/><stop offset="52%" stop-color="#021419"/><stop offset="100%" stop-color="#01090c"/>
  </radialGradient>
  <linearGradient id="nameG" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ffffff"/><stop offset="55%" stop-color="#ccfff7"/><stop offset="100%" stop-color="#2ee8cf"/>
  </linearGradient>
  <linearGradient id="ruleG" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#2ee8cf"/><stop offset="70%" stop-color="#2ee8cf" stop-opacity=".2"/><stop offset="100%" stop-color="#2ee8cf" stop-opacity="0"/>
  </linearGradient>
  <filter id="hazeB" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="46"/></filter>

  <linearGradient id="shell" x1="16%" y1="4%" x2="86%" y2="96%">
    <stop offset="0%"   stop-color="#e6fffb"/>
    <stop offset="18%"  stop-color="#a5fbf0"/>
    <stop offset="46%"  stop-color="#46e0d1"/>
    <stop offset="74%"  stop-color="#1cb0aa"/>
    <stop offset="100%" stop-color="#0a6f74"/>
  </linearGradient>
  <linearGradient id="shellArm" x1="8%" y1="0%" x2="92%" y2="100%">
    <stop offset="0%" stop-color="#ddfff9"/><stop offset="40%" stop-color="#5ce8da"/><stop offset="100%" stop-color="#0d7c80"/>
  </linearGradient>
  <radialGradient id="visor" cx="36%" cy="26%" r="84%">
    <stop offset="0%" stop-color="#0c2429"/><stop offset="55%" stop-color="#05161a"/><stop offset="100%" stop-color="#010a0d"/>
  </radialGradient>
  <linearGradient id="visorSheen" x1="4%" y1="0%" x2="58%" y2="100%">
    <stop offset="0%" stop-color="#bafff6" stop-opacity=".22"/>
    <stop offset="42%" stop-color="#bafff6" stop-opacity=".04"/>
    <stop offset="100%" stop-color="#bafff6" stop-opacity="0"/>
  </linearGradient>
  <filter id="eg" x="-90%" y="-90%" width="280%" height="280%">
    <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="sf14" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="sf8" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8"/></filter>
  <filter id="bloom" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="40"/></filter>

</defs>
<rect width="1000" height="300" rx="22" fill="url(#bgB)"/>
<g stroke="#2ee8cf" stroke-opacity=".045" stroke-width="1">
  <path d="M0 75H1000M0 150H1000M0 225H1000"/>
  <path d="M125 0V300M250 0V300M375 0V300M500 0V300M625 0V300M750 0V300M875 0V300"/>
</g>
<ellipse cx="172" cy="158" rx="178" ry="160" fill="#22d8c4" opacity=".24" filter="url(#hazeB)"/>
<g transform="translate(22 8) scale(0.78)">
<!-- antenna -->
<line x1="180" y1="58" x2="180" y2="92" stroke="#3fded0" stroke-width="6" stroke-linecap="round"/>
<circle cx="180" cy="48" r="12" fill="#8afff2" filter="url(#eg)">
  <animate attributeName="opacity" values="1;.4;1" dur="2.6s" repeatCount="indefinite"/>
  <animate attributeName="r" values="11;13;11" dur="2.6s" repeatCount="indefinite"/>
</circle>

<!-- WAVING ARM: shoulder -> forearm -> open hand with fingers -->
<g>
  <animateTransform attributeName="transform" type="rotate"
    values="-13 268 268; 7 268 268; -13 268 268" dur="2.5s" repeatCount="indefinite"/>
  <!-- upper arm from behind the shell, angled up-right -->
  <path d="M256 272 C276 244 294 212 306 186" stroke="url(#shellArm)" stroke-width="28" stroke-linecap="round" fill="none"/>
  <!-- palm -->
  <ellipse cx="316" cy="166" rx="25" ry="23" fill="url(#shellArm)"/>
  <!-- fingers -->
  <g fill="url(#shellArm)">
    <rect x="296" y="120" width="14" height="42" rx="7" transform="rotate(-13 303 141)"/>
    <rect x="311" y="114" width="14" height="48" rx="7" transform="rotate(-3 318 138)"/>
    <rect x="326" y="120" width="14" height="42" rx="7" transform="rotate(8 333 141)"/>
    <ellipse cx="295" cy="180" rx="10" ry="14" transform="rotate(-40 295 180)"/>
  </g>
  <g stroke="#1a9c9e" stroke-width="2" opacity=".45" stroke-linecap="round" fill="none">
    <path d="M309 130v30M324 126v34"/>
  </g>
  <ellipse cx="310" cy="158" rx="12" ry="10" fill="#ffffff" opacity=".5" filter="url(#sf8)"/>
</g>

<!-- head shell -->
<g>
  <rect x="62" y="92" width="196" height="166" rx="50" fill="url(#shell)"/>
  <!-- volumetric falloff bottom-right -->
  <ellipse cx="228" cy="226" rx="86" ry="74" fill="#06575e" opacity=".4" filter="url(#sf14)"/>
  <!-- key highlight upper-left -->
  <ellipse cx="110" cy="132" rx="44" ry="34" fill="#f0fffd" opacity=".6" filter="url(#sf14)"/>
  <!-- rim light right edge -->
  <path d="M208 92h0c28 0 50 22 50 50v66c0 28-22 50-50 50h-12c22-6 34-22 34-46v-74c0-24-12-40-34-46z"
        fill="#d9fff9" opacity=".3"/>
  <!-- ear pods -->
  <rect x="46" y="150" width="20" height="50" rx="10" fill="url(#shellArm)"/>
  <rect x="254" y="150" width="20" height="50" rx="10" fill="url(#shellArm)"/>
</g>

<!-- visor -->
<g>
  <rect x="86" y="120" width="148" height="100" rx="40" fill="#04343a" opacity=".6" filter="url(#sf8)"/>
  <rect x="88" y="118" width="144" height="96" rx="38" fill="url(#visor)"/>
  <rect x="88" y="118" width="144" height="96" rx="38" fill="url(#visorSheen)"/>
  <!-- eyes -->
  <g fill="#3dffdc" filter="url(#eg)">
    <rect x="122" y="152" width="18" height="30" rx="9">
      <animate attributeName="height" values="30;30;30;30;30;30;30;30;4;30" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="152;152;152;152;152;152;152;152;165;152" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="180" y="152" width="18" height="30" rx="9">
      <animate attributeName="height" values="30;30;30;30;30;30;30;30;4;30" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="152;152;152;152;152;152;152;152;165;152" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
</g>

<!-- body base -->
<g>
  <rect x="104" y="258" width="112" height="20" rx="10" fill="#0d8a8c"/>
  <rect x="120" y="278" width="80" height="12" rx="6" fill="#0a6f74"/>
</g>

</g>
<g>
  <rect x="392" y="44" width="166" height="42" rx="21" fill="#06333a" stroke="#2ee8cf" stroke-opacity=".55"/>
  <path d="M420 86 l-9 16 25-16z" fill="#06333a"/>
  <text x="475" y="71" fill="#9ff5e6" font-size="16.5" text-anchor="middle"
        font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Hello there</text>
  <animate attributeName="opacity" values=".35;1;1;1;1;.35" dur="4.6s" repeatCount="indefinite"/>
</g>
<g font-family="Segoe UI,Helvetica,Arial,sans-serif">
  <text x="392" y="166" fill="url(#nameG)" font-size="42" font-weight="700" letter-spacing="-1.1">Md. Jahid Hasan Raihan</text>
  <rect x="392" y="184" width="492" height="2" fill="url(#ruleG)"/>
  <text x="392" y="220" fill="#5eead4" font-size="16" font-family="ui-monospace,Menlo,Consolas,monospace">Full-Stack Developer · Django · React · PostgreSQL</text>
  <text x="392" y="251" fill="#4d8f8a" font-size="13.5" font-family="ui-monospace,Menlo,Consolas,monospace">Dhaka, Bangladesh  ·  I build complete systems, end to end</text>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="A friendly blob mascot waving hello beside the name Md. Jahid Hasan Raihan, full-stack developer">
<defs>
  <radialGradient id="bgB" cx="15%" cy="46%" r="96%">
    <stop offset="0%" stop-color="#05242a"/><stop offset="52%" stop-color="#021419"/><stop offset="100%" stop-color="#01090c"/>
  </radialGradient>
  <linearGradient id="nameG" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ffffff"/><stop offset="55%" stop-color="#ccfff7"/><stop offset="100%" stop-color="#2ee8cf"/>
  </linearGradient>
  <linearGradient id="ruleG" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#2ee8cf"/><stop offset="70%" stop-color="#2ee8cf" stop-opacity=".2"/><stop offset="100%" stop-color="#2ee8cf" stop-opacity="0"/>
  </linearGradient>
  <filter id="hazeB" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="46"/></filter>

  <!-- organic blob body: light pools upper-left, deep teal shadow lower-right -->
  <radialGradient id="jelly" cx="32%" cy="24%" r="88%">
    <stop offset="0%"   stop-color="#f0fffd"/>
    <stop offset="16%"  stop-color="#b3fdf4"/>
    <stop offset="42%"  stop-color="#58e8da"/>
    <stop offset="70%"  stop-color="#24bdb6"/>
    <stop offset="100%" stop-color="#0a6b72"/>
  </radialGradient>
  <radialGradient id="jellyArm" cx="28%" cy="18%" r="92%">
    <stop offset="0%" stop-color="#f6fffe"/><stop offset="30%" stop-color="#bafef5"/>
    <stop offset="62%" stop-color="#5ceadc"/><stop offset="100%" stop-color="#0d7a80"/>
  </radialGradient>
  <radialGradient id="screen" cx="38%" cy="28%" r="82%">
    <stop offset="0%" stop-color="#0b2126"/><stop offset="55%" stop-color="#041317"/><stop offset="100%" stop-color="#01080b"/>
  </radialGradient>
  <linearGradient id="gloss" x1="8%" y1="0%" x2="60%" y2="100%">
    <stop offset="0%" stop-color="#c8fff9" stop-opacity=".26"/>
    <stop offset="45%" stop-color="#c8fff9" stop-opacity=".04"/>
    <stop offset="100%" stop-color="#c8fff9" stop-opacity="0"/>
  </linearGradient>
  <filter id="eg" x="-90%" y="-90%" width="280%" height="280%">
    <feGaussianBlur stdDeviation="3.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="s16" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="16"/></filter>
  <filter id="s9"  x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
  <filter id="bloom" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="46"/></filter>

</defs>
<rect width="1000" height="300" rx="22" fill="url(#bgB)"/>
<g stroke="#2ee8cf" stroke-opacity=".045" stroke-width="1">
  <path d="M0 75H1000M0 150H1000M0 225H1000"/>
  <path d="M125 0V300M250 0V300M375 0V300M500 0V300M625 0V300M750 0V300M875 0V300"/>
</g>
<ellipse cx="176" cy="158" rx="180" ry="162" fill="#22d8c4" opacity=".24" filter="url(#hazeB)"/>
<g transform="translate(18 6) scale(0.755)">
<!-- ============ WAVING BLOB ARM ============ -->
<g>
  <animateTransform attributeName="transform" type="rotate"
    values="-14 150 320; 6 150 320; -14 150 320" dur="2.6s" repeatCount="indefinite"/>
  <!-- soft teardrop nub, wide at base, rounded tip -->
  <path d="M166 292
           C104 250  92 196 102 156
           C109 126 134 112 154 126
           C174 140 178 178 172 216
           C167 250 162 274 166 294 Z"
        fill="url(#jellyArm)"/>
  <path d="M198 220 C159 252 156 274 160 294 L178 294 C172 272 174 248 179 218 Z"
        fill="#075d5f" opacity=".42" filter="url(#s9)"/>
  <ellipse cx="124" cy="166" rx="24" ry="40" transform="rotate(-14 124 166)" fill="#ffffff" opacity=".34" filter="url(#s16)"/>
</g>

<!-- ============ BLOB BODY: asymmetric, gooey, settled ============ -->
<g>
  <path d="M240 78
           C296 78 340 118 348 178
           C354 224 348 266 328 288
           C306 312 264 322 224 320
           C184 318 148 304 132 278
           C114 250 116 204 132 166
           C150 124 188 78 240 78 Z"
        fill="url(#jelly)"/>
  <!-- weight/shadow pooling bottom-right -->
  <ellipse cx="288" cy="276" rx="100" ry="68" fill="#05585e" opacity=".42" filter="url(#s16)"/>
  <!-- key light upper-left -->
  <ellipse cx="176" cy="142" rx="52" ry="42" fill="#f2fffe" opacity=".55" filter="url(#s16)"/>
  <!-- rim light right -->
  <path d="M240 78c56 0 100 40 108 100c6 46 0 88-20 110c-13 15-34 25-58 29c26-12 41-29 47-50c9-38 11-84 2-118C310 112 282 88 240 82z"
        fill="#d6fff9" opacity=".3"/>
  <!-- gooey sheen -->
  <ellipse cx="206" cy="258" rx="82" ry="50" fill="#a6f9f0" opacity=".12" filter="url(#s16)"/>
</g>

<!-- ============ SCREEN FACE ============ -->
<g>
  <ellipse cx="246" cy="186" rx="86" ry="77" fill="#043b3e" opacity=".5" filter="url(#s9)"/>
  <ellipse cx="244" cy="182" rx="80" ry="72" fill="url(#screen)"/>
  <ellipse cx="244" cy="182" rx="80" ry="72" fill="url(#gloss)"/>
  <path d="M182 150 a80 72 0 0 1 64-42 a80 72 0 0 0-56 50z" fill="#cffff9" opacity=".13"/>

  <!-- happy curved eyes + smile -->
  <g fill="none" stroke="#3dffdc" stroke-width="9" stroke-linecap="round" filter="url(#eg)">
    <path d="M206 174 q12-16 24 0">
      <animate attributeName="d" values="M206 174 q12-16 24 0; M206 178 q12 2 24 0; M206 174 q12-16 24 0"
               dur="5.5s" repeatCount="indefinite"/>
    </path>
    <path d="M260 174 q12-16 24 0">
      <animate attributeName="d" values="M260 174 q12-16 24 0; M260 178 q12 2 24 0; M260 174 q12-16 24 0"
               dur="5.5s" repeatCount="indefinite"/>
    </path>
  </g>
  <path d="M222 212 q22 18 44 0" stroke="#3dffdc" stroke-width="7" fill="none" stroke-linecap="round" opacity=".92" filter="url(#eg)"/>
</g>

</g>
<g>
  <rect x="368" y="44" width="166" height="42" rx="21" fill="#06333a" stroke="#2ee8cf" stroke-opacity=".55"/>
  <path d="M396 86 l-9 16 25-16z" fill="#06333a"/>
  <text x="451" y="71" fill="#9ff5e6" font-size="16.5" text-anchor="middle"
        font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Hello there</text>
  <animate attributeName="opacity" values=".35;1;1;1;1;.35" dur="4.6s" repeatCount="indefinite"/>
</g>
<g font-family="Segoe UI,Helvetica,Arial,sans-serif">
  <text x="368" y="166" fill="url(#nameG)" font-size="43" font-weight="700" letter-spacing="-1.1">Md. Jahid Hasan Raihan</text>
  <rect x="368" y="184" width="512" height="2" fill="url(#ruleG)"/>
  <text x="368" y="220" fill="#5eead4" font-size="16" font-family="ui-monospace,Menlo,Consolas,monospace">Full-Stack Developer · Django · React · PostgreSQL</text>
  <text x="368" y="251" fill="#4d8f8a" font-size="13.5" font-family="ui-monospace,Menlo,Consolas,monospace">Dhaka, Bangladesh  ·  I build complete systems, end to end</text>
</g>
</svg>

</g>
<g>
  <rect x="684.0" y="164.0" width="132" height="64" rx="14" fill="#08222c" stroke="#1d6b78" stroke-width="1.4"/>
  <rect x="684.0" y="164.0" width="132" height="64" rx="14" fill="none" stroke="#3dffe0" stroke-width="1.8" opacity="0">

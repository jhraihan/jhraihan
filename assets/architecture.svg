<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Request lifecycle from React through DRF and Django to PostgreSQL">
  <defs>
    <linearGradient id="ln" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="cardg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e1b30"/><stop offset="100%" stop-color="#0a1322"/>
    </linearGradient>
    <filter id="g2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1000" height="300" rx="20" fill="#05090f"/>
  <g stroke="#22d3ee" stroke-opacity=".045"><path d="M0 75H1000M0 150H1000M0 225H1000"/></g>

  <text x="44" y="52" fill="#22d3ee" font-size="12.5" font-family="ui-monospace,Menlo,Consolas,monospace" letter-spacing="4.5">THE PATH OF A SINGLE REQUEST</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <g>
      <rect x="44" y="108" width="150" height="76" rx="14" fill="url(#cardg)" stroke="#22d3ee" stroke-opacity=".45"/>
      <text x="119" y="142" fill="#e2f4ff" font-size="15" text-anchor="middle" font-weight="700">React</text>
      <text x="119" y="163" fill="#6f8bb0" font-size="11.5" text-anchor="middle">Vite · Router</text>
    </g>
    <g>
      <rect x="252" y="108" width="150" height="76" rx="14" fill="url(#cardg)" stroke="#22d3ee" stroke-opacity=".45"/>
      <text x="327" y="142" fill="#e2f4ff" font-size="15" text-anchor="middle" font-weight="700">REST API</text>
      <text x="327" y="163" fill="#6f8bb0" font-size="11.5" text-anchor="middle">DRF · JWT</text>
    </g>
    <g>
      <rect x="460" y="108" width="150" height="76" rx="14" fill="url(#cardg)" stroke="#22d3ee" stroke-opacity=".45"/>
      <text x="535" y="142" fill="#e2f4ff" font-size="15" text-anchor="middle" font-weight="700">Django</text>
      <text x="535" y="163" fill="#6f8bb0" font-size="11.5" text-anchor="middle">views · permissions</text>
    </g>
    <g>
      <rect x="668" y="108" width="150" height="76" rx="14" fill="url(#cardg)" stroke="#22d3ee" stroke-opacity=".45"/>
      <text x="743" y="142" fill="#e2f4ff" font-size="15" text-anchor="middle" font-weight="700">ORM</text>
      <text x="743" y="163" fill="#6f8bb0" font-size="11.5" text-anchor="middle">queryset · prefetch</text>
    </g>
    <g>
      <rect x="876" y="108" width="80" height="76" rx="14" fill="#101d38" stroke="#6366f1" stroke-opacity=".8"/>
      <text x="916" y="140" fill="#a5b4fc" font-size="13" text-anchor="middle" font-weight="700">DB</text>
      <text x="916" y="160" fill="#6f8bb0" font-size="10.5" text-anchor="middle">Postgres</text>
    </g>

    <path d="M194 146H252M402 146H460M610 146H668M818 146H876" stroke="url(#ln)" stroke-width="2" stroke-opacity=".6" fill="none"/>
    <g fill="#67e8f9" filter="url(#g2)">
      <circle r="4.5"><animateMotion dur="3.6s" repeatCount="indefinite" path="M194 146H252M402 146H460M610 146H668M818 146H876"/></circle>
    </g>
    <g fill="#22d3ee" opacity=".85">
      <path d="M245 141l8 5-8 5z"/><path d="M453 141l8 5-8 5z"/><path d="M661 141l8 5-8 5z"/><path d="M869 141l8 5-8 5z"/>
    </g>

    <text x="44" y="232" fill="#8aa6c8" font-size="12.5">Auth at the edge · permissions per role · prefetch to kill N+1 · schema designed before the first endpoint</text>
    <text x="44" y="258" fill="#4a6590" font-size="11.5">Every project below is a whole system — interface, API and database — not an isolated feature.</text>
  </g>
</svg>

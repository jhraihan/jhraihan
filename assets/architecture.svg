<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Request lifecycle: browser through React, REST API, Django, ORM, to PostgreSQL">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3bff97"/><stop offset="100%" stop-color="#17b46a"/>
    </linearGradient>
    <filter id="gl" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="300" rx="18" fill="#03130d"/>
  <g stroke="#2ef08a" stroke-opacity=".06"><path d="M0 75H900M0 150H900M0 225H900"/></g>

  <text x="40" y="52" fill="#2ee98c" font-size="13" font-family="ui-monospace,Menlo,Consolas,monospace" letter-spacing="3">HOW A REQUEST TRAVELS</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <!-- nodes -->
    <g>
      <rect x="40" y="110" width="132" height="66" rx="12" fill="#07231a" stroke="#28d97f" stroke-opacity=".5"/>
      <text x="106" y="140" fill="#eafff4" font-size="14" text-anchor="middle" font-weight="700">React</text>
      <text x="106" y="159" fill="#5fcf98" font-size="11" text-anchor="middle">Vite · Router</text>
    </g>
    <g>
      <rect x="232" y="110" width="132" height="66" rx="12" fill="#07231a" stroke="#28d97f" stroke-opacity=".5"/>
      <text x="298" y="140" fill="#eafff4" font-size="14" text-anchor="middle" font-weight="700">REST API</text>
      <text x="298" y="159" fill="#5fcf98" font-size="11" text-anchor="middle">DRF · JWT</text>
    </g>
    <g>
      <rect x="424" y="110" width="132" height="66" rx="12" fill="#07231a" stroke="#28d97f" stroke-opacity=".5"/>
      <text x="490" y="140" fill="#eafff4" font-size="14" text-anchor="middle" font-weight="700">Django</text>
      <text x="490" y="159" fill="#5fcf98" font-size="11" text-anchor="middle">views · perms</text>
    </g>
    <g>
      <rect x="616" y="110" width="132" height="66" rx="12" fill="#07231a" stroke="#28d97f" stroke-opacity=".5"/>
      <text x="682" y="140" fill="#eafff4" font-size="14" text-anchor="middle" font-weight="700">ORM</text>
      <text x="682" y="159" fill="#5fcf98" font-size="11" text-anchor="middle">queryset</text>
    </g>
    <g>
      <rect x="796" y="110" width="66" height="66" rx="12" fill="#0b3325" stroke="#3bff97" stroke-opacity=".75"/>
      <text x="829" y="139" fill="#3bff97" font-size="12" text-anchor="middle" font-weight="700">DB</text>
      <text x="829" y="157" fill="#5fcf98" font-size="10" text-anchor="middle">Postgres</text>
    </g>

    <!-- flow line + travelling packet -->
    <path id="flow" d="M172 143H232M364 143H424M556 143H616M748 143H796" stroke="url(#g1)" stroke-width="2" stroke-opacity=".55" fill="none"/>
    <g fill="#3bff97" filter="url(#gl)">
      <circle r="4" cx="0" cy="0">
        <animateMotion dur="3.4s" repeatCount="indefinite" path="M172 143H232M364 143H424M556 143H616M748 143H796"/>
      </circle>
    </g>
    <g fill="#28d97f" opacity=".85">
      <path d="M225 138l8 5-8 5z"/><path d="M417 138l8 5-8 5z"/><path d="M609 138l8 5-8 5z"/><path d="M789 138l8 5-8 5z"/>
    </g>

    <text x="40" y="228" fill="#4fbf8d" font-size="12">Auth at the edge · permissions per role · prefetch to kill N+1 · schema designed before the first endpoint</text>
    <text x="40" y="252" fill="#2c8f65" font-size="11.5">Every project below is a whole system — interface, API, and database — not an isolated feature.</text>
  </g>
</svg>

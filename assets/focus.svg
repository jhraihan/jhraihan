<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 262" width="900" height="262" role="img" aria-label="What I reach for first: Django and DRF, React, schema design, and data structures">
  <defs>
    <linearGradient id="fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#41ff9c" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#41ff9c" stop-opacity=".12"/>
    </linearGradient>
  </defs>
  <rect width="900" height="262" rx="18" fill="#03130d"/>
  <g stroke="#2ef08a" stroke-opacity=".05"><path d="M0 66H900M0 132H900M0 198H900"/></g>
  <text x="40" y="46" fill="#2ee98c" font-size="13" font-family="ui-monospace,Menlo,Consolas,monospace" letter-spacing="3">WHAT I REACH FOR FIRST</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <g>
      <rect x="40" y="74" width="3" height="34" fill="#41ff9c"/>
      <rect x="52" y="74" width="300" height="34" fill="url(#fade)" opacity=".13"/>
      <text x="64" y="90" fill="#eafff4" font-size="14" font-weight="700">Django · DRF</text>
      <text x="64" y="104" fill="#5fcf98" font-size="11.5">where most of my thinking happens</text>
    </g>
    <g>
      <rect x="470" y="74" width="3" height="34" fill="#41ff9c" opacity=".8"/>
      <rect x="482" y="74" width="300" height="34" fill="url(#fade)" opacity=".1"/>
      <text x="494" y="90" fill="#eafff4" font-size="14" font-weight="700">React</text>
      <text x="494" y="104" fill="#5fcf98" font-size="11.5">decoupled frontends against my own APIs</text>
    </g>
    <g>
      <rect x="40" y="140" width="3" height="34" fill="#41ff9c" opacity=".8"/>
      <rect x="52" y="140" width="300" height="34" fill="url(#fade)" opacity=".1"/>
      <text x="64" y="156" fill="#eafff4" font-size="14" font-weight="700">Relational schema design</text>
      <text x="64" y="170" fill="#5fcf98" font-size="11.5">the shape decided before the first endpoint</text>
    </g>
    <g>
      <rect x="470" y="140" width="3" height="34" fill="#41ff9c" opacity=".65"/>
      <rect x="482" y="140" width="300" height="34" fill="url(#fade)" opacity=".08"/>
      <text x="494" y="156" fill="#eafff4" font-size="14" font-weight="700">Data structures · algorithms</text>
      <text x="494" y="170" fill="#5fcf98" font-size="11.5">where I go to sharpen how I think</text>
    </g>
  </g>

  <text x="40" y="216" fill="#4fbf8d" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace">Auth at the edge · permissions per role · prefetch to kill N+1</text>
  <text x="40" y="240" fill="#2c8f65" font-size="11.5" font-family="ui-monospace,Menlo,Consolas,monospace">I would rather understand why something works than just get it working.</text>
</svg>
